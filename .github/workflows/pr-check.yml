name: Check PR

on:
  pull_request:
    branches: [prod, staging]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Check PR (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep the first entry aligned with .nvmrc.
        node: ['22.23.2']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Commit lint PR title
        run: echo "${{ github.event.pull_request.title }}" | npx --no-install commitlint -g commitlint.config.js

      - name: Check eslint
        run: npm run lint:check

      - name: Typescript check
        run: npm run ts:check

      - name: Test
        run: npm run test -- --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-${{ matrix.node }}
          path: coverage

      - name: Build
        run: |
          npm pkg delete scripts.prepare
          npm run build -- --failAfterWarnings

      - name: Check packed declarations
        if: matrix.node == '22.23.2'
        run: npm run test:package

  sonarcube:
    runs-on: ubuntu-latest
    needs: check
    concurrency:
      group: ${{ github.ref }}-sonarcube
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-lcov-22.23.2
          path: coverage

      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
